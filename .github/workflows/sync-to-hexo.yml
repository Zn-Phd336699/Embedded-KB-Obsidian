name: Sync Obsidian Notes to Hexo Blog

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Obsidian vault
        uses: actions/checkout@v4
        with:
          path: vault

      - name: Checkout Hexo blog repo
        uses: actions/checkout@v4
        with:
          repository: Zn-Phd336699/Learning-Obsidian.
          token: ${{ secrets.HEXO_PAT }}
          path: hexo-blog
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script
        env:
          VAULT_PATH: ${{ github.workspace }}/vault
          HEXO_PATH: ${{ github.workspace }}/hexo-blog
          CONFIG_PATH: ${{ github.workspace }}/vault/blog-publish.config.json
        run: node ${GITHUB_WORKSPACE}/vault/sync-blog-script.js

      - name: Commit & Push to Hexo repo
        working-directory: ${{ github.workspace }}/hexo-blog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: sync from Obsidian vault $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi
